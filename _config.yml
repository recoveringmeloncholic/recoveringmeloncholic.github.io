# Site settings
title: Recovering melancholic
description: Chronicles of a recovering melancholic
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site

# Build settings
markdown: kramdown
permalink: /:year/:month/:day/:title/

# Collections
collections:
  posts:
    output: true
    permalink: /:year/:month/:day/:title/

# Comments (custom widget backed by a Google Sheet via Apps Script)
comments:
  api_url: "https://script.google.com/macros/s/AKfycbz4CG1vHZFImeNxDeL5cCBz9rbu3GfUllPQLihbhQ0GsDUAXI7gq_T6ktcYrQORT_IwUw/exec"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - google-apps-script
